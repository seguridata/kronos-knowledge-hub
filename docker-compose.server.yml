# Despliegue en servidor compartido (Caddy en la red externa `proxy_net`).
# La app no publica puertos: Caddy llega a ella por `kronos:3010`.
# Guía: docs/despliegue-servidor.md
#
# Uso:  cp .env.server.example .env   (y completar secretos)
#       docker compose -f docker-compose.server.yml up -d --build
name: kronos

services:
  kronos:
    # Para descargar la imagen publicada, usar `pull`; para construir en el servidor, `--build`.
    image: ${KRONOS_IMAGE:-ghcr.io/seguridata/kronos-knowledge-hub:latest}
    build: .
    env_file: .env
    environment:
      PORT: 3010
      DATABASE_URL: postgresql://${POSTGRES_USER:-kronos}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}@db:5432/${POSTGRES_DB:-kronos}
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - kronos_interna
      - proxy_net
    volumes:
      - kronos_storage:/app/data/storage

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kronos}
      POSTGRES_USER: ${POSTGRES_USER:-kronos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - kronos_interna
    volumes:
      - kronos_db:/var/lib/postgresql

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - kronos_interna
    volumes:
      - kronos_redis:/data

networks:
  kronos_interna:
    driver: bridge
  proxy_net:
    external: true

volumes:
  kronos_storage:
  kronos_db:
  kronos_redis:
